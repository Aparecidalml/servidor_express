<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <h1>Login</h1>
    <form action="/validarLogin" method="post">
        <label>Email</label>
        <input type="email" placeholder="Digite seu email" id="email" name="email"> <br><br>
        <label>Senha</label>
        <input type="password" placeholder="Digite sua senha" id="senha" name="senha"><br><br>
        <button type="submit"> Entrar </button>
    </form>
    <p> Não possui conta? <a href="/cadastroUsuario"> Criar conta </a> </p>

</body>
</html>
