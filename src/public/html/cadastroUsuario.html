<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro</title>
</head>

<body>
    <h1>Criar Conta</h1>
    <form action="/usuario" method="post">
        <label>Nome</label>
        <input type="text" placeholder="Digite seu nome" id="nome" name="nome"><br><br>
        <label>Email</label>
        <input type="email" placeholder="Digite seu email" id="email" name="email"><br><br>
        <label>Senha</label>
        <input type="password" placeholder="Digite sua senha" id="senha" name="senha"><br><br>
        <button type="submit"> Cadastrar </button>
    </form>
    <p> Já possui conta? <a href="/login">  Entrar  </a></p>    

</body>
</html>
